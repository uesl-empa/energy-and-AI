title: "AI & Urban Energy Systems | UESL Empa"
tagline: Urban Energy Systems Lab (UESL)
description: >-
  How UESL uses artificial intelligence in energy research — projects, papers, and tools
  explained for a general audience.
baseurl: "/energy-and-AI"
url: "https://uesl-empa.github.io"

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

defaults:
  - scope:
      path: "docs"
    values:
      layout: docs
